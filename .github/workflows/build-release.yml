name: Build, Release, and Deploy Resume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache TeX Live
        uses: actions/cache@v4
        with:
          path: /usr/share/texlive
          key: texlive-${{ runner.os }}

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-lang-english

      - name: Build resume
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error resume.tex

      - name: Prepare Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p public
          cp resume.pdf public/resume.pdf
          cp index.html public/index.html
          touch public/.nojekyll

      - name: Deploy Pages branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pages
          git init pages
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --orphan gh-pages
          cp -R ../public/. .
          git add --all
          git commit -m "Deploy resume ${GITHUB_SHA}"
          git push --force origin gh-pages

      - name: Generate version tag
        if: github.event_name == 'push'
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Resume ${{ steps.version.outputs.tag }}
          files: resume.pdf
          body: |
            Auto-generated from commit ${{ github.sha }}

            Built on ${{ github.event.head_commit.timestamp }}
