name: Build and Release Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache TeX Live
        uses: actions/cache@v4
        with:
          path: /usr/share/texlive
          key: texlive-${{ runner.os }}

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-extra

      - name: Build resume
        run: |
          xelatex -interaction=nonstopmode resume.tex || true
          xelatex -interaction=nonstopmode resume.tex || true
          test -f resume.pdf

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Resume ${{ steps.version.outputs.tag }}
          files: resume.pdf
          body: |
            Auto-generated from commit ${{ github.sha }}

            Built on ${{ github.event.head_commit.timestamp }}
